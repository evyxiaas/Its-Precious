<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cloudy 💙</title>

<style>

/* =========================================================
   VARIABLES
========================================================= */

:root {
    --blue-1: #effaff;
    --blue-2: #e2f6ff;
    --blue-3: #c9edfc;
    --blue-4: #a8ddf5;
    --blue-5: #72c8eb;
    --blue-6: #4db2df;

    --text: #47758f;
    --dark-text: #315d73;

    --white: rgba(255,255,255,.95);

    --shadow:
        0 18px 45px rgba(73,137,167,.14);

    --soft-shadow:
        0 8px 25px rgba(73,137,167,.10);

    --radius: 26px;
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;

    font-family:
        "Segoe UI",
        "Trebuchet MS",
        Arial,
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(255,255,255,.95),
            transparent 25%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(255,255,255,.8),
            transparent 25%
        ),
        linear-gradient(
            135deg,
            #effaff,
            #dff5ff,
            #eaf9ff
        );

    overflow-x: hidden;
}


/* =========================================================
   BACKGROUND
========================================================= */

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: -1;
}

.cloud {
    position: absolute;

    background:
        rgba(255,255,255,.55);

    border-radius: 100px;

    filter: blur(1px);

    animation:
        floatCloud 12s ease-in-out infinite;
}

.cloud::before,
.cloud::after {
    content: "";

    position: absolute;

    background: inherit;

    border-radius: 50%;
}

.cloud::before {
    width: 60px;
    height: 60px;

    left: 25px;
    bottom: 15px;
}

.cloud::after {
    width: 80px;
    height: 80px;

    right: 25px;
    bottom: 10px;
}

.cloud.one {
    width: 160px;
    height: 45px;

    top: 12%;
    left: -30px;
}

.cloud.two {
    width: 210px;
    height: 55px;

    top: 48%;
    right: -60px;

    animation-delay: -5s;
}

.cloud.three {
    width: 130px;
    height: 40px;

    bottom: 10%;
    left: 15%;

    animation-delay: -8s;
}

@keyframes floatCloud {

    0%, 100% {
        transform:
            translateX(0)
            translateY(0);
    }

    50% {
        transform:
            translateX(25px)
            translateY(-12px);
    }
}

.sparkle {
    position: absolute;

    color: white;

    opacity: .7;

    animation:
        sparkle 3s ease-in-out infinite;
}

.sparkle:nth-child(4) {
    top: 20%;
    left: 18%;
}

.sparkle:nth-child(5) {
    top: 30%;
    right: 15%;

    animation-delay: 1s;
}

.sparkle:nth-child(6) {
    bottom: 20%;
    right: 30%;

    animation-delay: 2s;
}

@keyframes sparkle {

    0%,100% {
        transform:
            scale(.7)
            rotate(0deg);

        opacity: .3;
    }

    50% {
        transform:
            scale(1.2)
            rotate(20deg);

        opacity: 1;
    }
}


/* =========================================================
   NAVBAR
========================================================= */

.navbar {
    position: sticky;

    top: 0;

    z-index: 100;

    width: 100%;

    padding:
        14px 5%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background:
        rgba(235,249,255,.82);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    border-bottom:
        1px solid
        rgba(255,255,255,.8);

    box-shadow:
        0 5px 25px
        rgba(80,160,200,.08);
}

.logo {
    display: flex;

    align-items: center;

    gap: 10px;

    font-size: 22px;

    font-weight: 800;

    color:
        var(--dark-text);

    cursor: pointer;
}

.logoBubble {
    width: 42px;
    height: 42px;

    display: grid;

    place-items: center;

    border-radius: 15px;

    background: white;

    box-shadow:
        var(--soft-shadow);

    animation:
        logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat {

    0%,100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-4px);
    }
}

.navButtons {
    display: flex;

    gap: 8px;
}

.navBtn {
    border: none;

    background:
        rgba(255,255,255,.65);

    color:
        var(--text);

    padding:
        10px 15px;

    border-radius:
        14px;

    cursor: pointer;

    transition:
        .25s ease;

    font-weight: 600;
}

.navBtn:hover {
    background:
        white;

    transform:
        translateY(-2px);

    box-shadow:
        var(--soft-shadow);
}


/* =========================================================
   MAIN
========================================================= */

main {
    width:
        min(1050px, 92%);

    margin:
        auto;

    padding:
        45px 0 80px;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    text-align:
        center;

    margin-bottom:
        40px;

    animation:
        fadeUp .7s ease;
}

.heroIcon {
    width: 75px;
    height: 75px;

    margin:
        0 auto 15px;

    display:
        grid;

    place-items:
        center;

    font-size:
        35px;

    background:
        rgba(255,255,255,.8);

    border-radius:
        25px;

    box-shadow:
        var(--shadow);

    animation:
        floatIcon 3s ease-in-out infinite;
}

@keyframes floatIcon {

    0%,100% {
        transform:
            translateY(0)
            rotate(0);
    }

    50% {
        transform:
            translateY(-7px)
            rotate(2deg);
    }
}

.hero h1 {
    font-size:
        clamp(30px,5vw,48px);

    color:
        var(--dark-text);

    margin-bottom:
        8px;
}

.hero p {
    opacity:
        .75;

    font-size:
        16px;
}


/* =========================================================
   FEED
========================================================= */

.feed {
    display:
        flex;

    flex-direction:
        column;

    gap:
        28px;
}


/* =========================================================
   POST
========================================================= */

.post {
    background:
        var(--white);

    border:
        1px solid
        rgba(255,255,255,.95);

    border-radius:
        var(--radius);

    overflow:
        hidden;

    box-shadow:
        var(--shadow);

    animation:
        postAppear .6s
        cubic-bezier(.2,.8,.2,1);

    transition:
        .3s ease;
}

.post:hover {
    transform:
        translateY(-4px);

    box-shadow:
        0 22px 50px
        rgba(73,137,167,.18);
}

@keyframes postAppear {

    from {
        opacity:
            0;

        transform:
            translateY(25px)
            scale(.98);
    }

    to {
        opacity:
            1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   POST HEADER
========================================================= */

.postHeader {
    padding:
        16px 19px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;
}

.profile {
    display:
        flex;

    align-items:
        center;

    gap:
        11px;
}

.avatar {
    width:
        40px;

    height:
        40px;

    display:
        grid;

    place-items:
        center;

    border-radius:
        50%;

    background:
        linear-gradient(
            135deg,
            #dff6ff,
            #a8def7
        );

    box-shadow:
        inset
        0 0 0 3px
        rgba(255,255,255,.7);
}

.username {
    font-weight:
        800;

    color:
        var(--dark-text);
}

.date {
    font-size:
        11px;

    opacity:
        .55;
}

.moreBtn {
    border:
        none;

    background:
        transparent;

    font-size:
        20px;

    color:
        var(--text);

    cursor:
        pointer;

    padding:
        5px 10px;

    border-radius:
        10px;
}


/* =========================================================
   POST BODY
========================================================= */

.postBody {
    display:
        grid;

    grid-template-columns:
        minmax(0, 1.55fr)
        minmax(280px, .75fr);

    min-height:
        360px;
}

.postMediaContainer {
    position:
        relative;

    min-width:
        0;

    background:
        #dff5ff;

    overflow:
        hidden;
}

.postMedia {
    width:
        100%;

    height:
        100%;

    min-height:
        360px;

    display:
        block;

    object-fit:
        cover;

    background:
        #dff5ff;
}

.postVideo {
    width:
        100%;

    height:
        100%;

    min-height:
        360px;

    display:
        block;

    object-fit:
        cover;

    background:
        #ccefff;
}

.postSide {
    display:
        flex;

    flex-direction:
        column;

    justify-content:
        space-between;

    padding:
        24px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.95),
            rgba(235,249,255,.95)
        );

    border-left:
        1px solid
        rgba(180,225,242,.45);
}

.caption {
    line-height:
        1.65;

    color:
        var(--dark-text);

    white-space:
        pre-wrap;

    word-break:
        break-word;

    font-size:
        15px;
}

.captionEmpty {
    color:
        #91aebd;

    font-style:
        italic;

    opacity:
        .7;
}


/* =========================================================
   POST ACTIONS
========================================================= */

.postActions {
    display:
        flex;

    align-items:
        center;

    gap:
        9px;

    flex-wrap:
        wrap;

    margin-top:
        25px;
}

.actionBtn {
    border:
        none;

    background:
        var(--blue-1);

    color:
        var(--text);

    padding:
        9px 13px;

    border-radius:
        13px;

    cursor:
        pointer;

    font-weight:
        600;

    transition:
        .2s ease;
}

.actionBtn:hover {
    background:
        var(--blue-2);

    transform:
        translateY(-2px);
}

.actionBtn.liked {
    background:
        #c7ecff;

    color:
        #288bb8;
}


/* =========================================================
   COMMENTS
========================================================= */

.commentsSection {
    display:
        none;

    padding:
        0 24px 24px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.95),
            rgba(235,249,255,.95)
        );

    border-top:
        1px solid
        rgba(180,225,242,.4);
}

.commentsSection.open {
    display:
        block;

    animation:
        commentOpen .35s ease;
}

@keyframes commentOpen {

    from {
        opacity: 0;
        transform:
            translateY(-5px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }
}

.commentsTitle {
    padding:
        18px 0 12px;

    color:
        var(--dark-text);

    font-weight:
        800;

    font-size:
        14px;
}

.commentList {
    display:
        flex;

    flex-direction:
        column;

    gap:
        12px;

    max-height:
        260px;

    overflow-y:
        auto;

    padding-right:
        5px;
}

.comment {
    display:
        flex;

    align-items:
        flex-start;

    gap:
        10px;

    padding:
        10px 12px;

    border-radius:
        15px;

    background:
        rgba(255,255,255,.7);

    animation:
        commentAppear .3s ease;
}

@keyframes commentAppear {

    from {
        opacity: 0;
        transform:
            translateY(7px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }
}

.commentName {
    width:
        30px;

    min-width:
        30px;

    height:
        30px;

    display:
        grid;

    place-items:
        center;

    border-radius:
        50%;

    background:
        var(--blue-2);

    color:
        var(--dark-text);

    font-size:
        16px;

    font-weight:
        700;
}

.commentContent {
    flex:
        1;

    min-width:
        0;
}

.commentDelete {
    border:
        none;

    background:
        transparent;

    color:
        #8ab5c8;

    cursor:
        pointer;

    font-size:
        12px;

    padding:
        4px;

    border-radius:
        8px;
}

.commentDelete:hover {
    background:
        #e2f6ff;

    color:
        #288bb8;
}

.commentText {
    color:
        var(--dark-text);

    font-size:
        13px;

    line-height:
        1.45;

    word-break:
        break-word;
}

.commentTime {
    margin-top:
        3px;

    font-size:
        10px;

    opacity:
        .5;
}

.noComments {
    text-align:
        center;

    padding:
        15px;

    opacity:
        .55;

    font-size:
        13px;
}

.commentInputRow {
    display:
        flex;

    gap:
        8px;

    margin-top:
        12px;
}

.commentInput {
    flex:
        1;

    min-width:
        0;

    border:
        1px solid
        rgba(150,210,235,.5);

    outline:
        none;

    background:
        white;

    color:
        var(--dark-text);

    padding:
        11px 13px;

    border-radius:
        13px;

    font-family:
        inherit;

    font-size:
        13px;

    transition:
        .2s;
}

.commentInput:focus {
    border-color:
        var(--blue-5);

    box-shadow:
        0 0 0 3px
        rgba(114,200,235,.15);
}

.commentSend {
    border:
        none;

    background:
        var(--blue-5);

    color:
        white;

    border-radius:
        13px;

    padding:
        0 15px;

    cursor:
        pointer;

    font-weight:
        700;

    transition:
        .2s;
}

.commentSend:hover {
    background:
        var(--blue-6);

    transform:
        translateY(-2px);
}


/* =========================================================
   EMPTY
========================================================= */

.empty {
    text-align:
        center;

    padding:
        65px 20px;

    background:
        rgba(255,255,255,.55);

    border:
        2px dashed
        rgba(105,197,236,.35);

    border-radius:
        25px;
}

.emptyIcon {
    font-size:
        50px;

    margin-bottom:
        10px;
}

.empty h2 {
    color:
        var(--dark-text);

    margin-bottom:
        5px;
}

.empty p {
    opacity:
        .65;
}


/* =========================================================
   OVERLAY
========================================================= */

.overlay {
    position:
        fixed;

    inset:
        0;

    z-index:
        500;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        18px;

    background:
        rgba(55,125,160,.28);

    backdrop-filter:
        blur(9px);

    -webkit-backdrop-filter:
        blur(9px);

    animation:
        overlayIn .25s ease;

    overflow:
        hidden;
}

.overlay.hidden {
    display:
        none;
}

@keyframes overlayIn {

    from {
        opacity:
            0;
    }

    to {
        opacity:
            1;
    }
}


/* =========================================================
   GENERAL MODAL
========================================================= */

.modal {
    width:
        min(500px, 100%);

    max-height:
        calc(100dvh - 36px);

    overflow-y:
        auto;

    overscroll-behavior:
        contain;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.98),
            rgba(234,249,255,.98)
        );

    border:
        1px solid white;

    border-radius:
        30px;

    padding:
        30px;

    box-shadow:
        0 30px 80px
        rgba(50,130,170,.25);

    animation:
        modalIn .4s
        cubic-bezier(.2,.8,.2,1);

    scrollbar-width:
        thin;

    scrollbar-color:
        var(--blue-4)
        transparent;
}

.modal::-webkit-scrollbar {
    width:
        6px;
}

.modal::-webkit-scrollbar-thumb {
    background:
        var(--blue-4);

    border-radius:
        20px;
}

@keyframes modalIn {

    from {
        opacity:
            0;

        transform:
            translateY(25px)
            scale(.92);
    }

    to {
        opacity:
            1;

        transform:
            translateY(0)
            scale(1);
    }
}

.modalTop {
    text-align:
        center;

    margin-bottom:
        22px;
}

.modalIcon {
    font-size:
        42px;

    margin-bottom:
        7px;
}

.modal h2 {
    color:
        var(--dark-text);

    font-size:
        27px;

    margin-bottom:
        5px;
}

.modal p {
    opacity:
        .65;
}


/* =========================================================
   CHOICE
========================================================= */

.choiceContainer {
    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        15px;
}

.choice {
    border:
        none;

    padding:
        25px 15px;

    border-radius:
        22px;

    background:
        white;

    color:
        var(--text);

    cursor:
        pointer;

    box-shadow:
        var(--soft-shadow);

    transition:
        .3s
        cubic-bezier(.2,.8,.2,1);
}

.choice:hover {
    transform:
        translateY(-7px);

    box-shadow:
        0 15px 35px
        rgba(70,160,200,.18);
}

.choiceIcon {
    font-size:
        35px;

    margin-bottom:
        10px;
}

.choice strong {
    display:
        block;

    color:
        var(--dark-text);

    margin-bottom:
        4px;
}

.choice span {
    font-size:
        12px;

    opacity:
        .6;
}


/* =========================================================
   PASSWORD
========================================================= */

.passwordBox {
    display:
        flex;

    flex-direction:
        column;

    gap:
        12px;
}

.input {
    width:
        100%;

    border:
        2px solid
        transparent;

    outline:
        none;

    background:
        white;

    padding:
        14px 16px;

    border-radius:
        15px;

    color:
        var(--dark-text);

    font-size:
        15px;

    transition:
        .25s;
}

.input:focus {
    border-color:
        var(--blue-4);

    box-shadow:
        0 0 0 4px
        rgba(145,214,244,.18);
}

.primaryBtn {
    border:
        none;

    padding:
        14px;

    border-radius:
        15px;

    background:
        linear-gradient(
            135deg,
            var(--blue-5),
            var(--blue-6)
        );

    color:
        white;

    font-weight:
        800;

    cursor:
        pointer;

    transition:
        .25s;
}

.primaryBtn:hover {
    transform:
        translateY(-2px);

    box-shadow:
        0 10px 25px
        rgba(70,160,200,.25);
}

.secondaryBtn {
    border:
        none;

    background:
        transparent;

    color:
        var(--text);

    padding:
        10px;

    cursor:
        pointer;

    font-weight:
        600;
}


/* =========================================================
   CREATE MODAL
========================================================= */

.createModal {

    width:
        min(850px, 100%);

    max-height:
        calc(100dvh - 30px);

    overflow-y:
        auto;

    padding:
        28px;

    display:
        flex;

    flex-direction:
        column;
}


/* =========================================================
   TYPE SELECTOR
========================================================= */

.typeSelector {
    display:
        flex;

    gap:
        8px;

    margin-bottom:
        14px;

    flex-shrink:
        0;
}

.typeBtn {
    flex:
        1;

    border:
        none;

    padding:
        11px;

    border-radius:
        13px;

    background:
        var(--blue-1);

    color:
        var(--text);

    cursor:
        pointer;

    font-weight:
        600;

    transition:
        .2s;
}

.typeBtn.active {
    background:
        var(--blue-4);

    color:
        white;
}


/* =========================================================
   CREATE CONTENT
========================================================= */

.createContent {

    display:
        grid;

    grid-template-columns:
        minmax(0, 1.45fr)
        minmax(250px, .8fr);

    gap:
        15px;

    align-items:
        stretch;
}


/* =========================================================
   UPLOAD AREA
========================================================= */

.uploadArea {
    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;

    width:
        100%;

    min-height:
        220px;

    height:
        100%;

    border:
        2px dashed
        var(--blue-4);

    border-radius:
        20px;

    background:
        rgba(255,255,255,.55);

    padding:
        25px;

    text-align:
        center;

    cursor:
        pointer;

    transition:
        background .25s ease,
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;

    overflow:
        hidden;
}

.uploadArea:hover {
    background:
        rgba(255,255,255,.9);

    border-color:
        var(--blue-5);

    transform:
        translateY(-2px);

    box-shadow:
        0 10px 25px
        rgba(80,165,205,.10);
}

.uploadArea.dragover {
    background:
        var(--blue-2);

    border-color:
        var(--blue-5);

    transform:
        scale(1.015);
}

.uploadIcon {
    font-size:
        42px;

    line-height:
        1;

    margin-bottom:
        12px;

    display:
        block;

    animation:
        cameraFloat
        3s ease-in-out infinite;
}

.uploadArea strong {
    display:
        block;

    color:
        var(--dark-text);

    font-size:
        17px;

    margin-bottom:
        5px;
}

.uploadArea p {
    display:
        block;

    margin:
        0;

    font-size:
        13px;

    opacity:
        .65;
}

@keyframes cameraFloat {

    0%,100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-5px);
    }
}


/* =========================================================
   CREATE RIGHT
========================================================= */

.createRight {
    display:
        flex;

    flex-direction:
        column;

    min-width:
        0;
}

.createRight label {
    font-size:
        13px;

    font-weight:
        700;

    color:
        var(--dark-text);

    margin-bottom:
        7px;
}

#captionInput {
    width:
        100%;

    flex:
        1;

    min-height:
        160px;

    resize:
        none;

    line-height:
        1.55;
}


/* =========================================================
   PREVIEW
========================================================= */

.preview {
    margin-top:
        14px;

    border-radius:
        18px;

    overflow:
        hidden;

    display:
        none;

    background:
        #dff5ff;

    width:
        100%;

    aspect-ratio:
        16 / 9;
}

.preview img,
.preview video {
    width:
        100%;

    height:
        100%;

    object-fit:
        contain;

    display:
        block;
}


/* =========================================================
   CREATE ACTIONS
========================================================= */

.createActions {

    position:
        sticky;

    bottom:
        0;

    z-index:
        5;

    display:
        flex;

    gap:
        10px;

    margin-top:
        15px;

    padding-top:
        12px;

    background:
        linear-gradient(
            to bottom,
            rgba(235,249,255,0),
            rgba(235,249,255,.98) 25%
        );

    flex-shrink:
        0;
}

.createActions button {
    flex:
        1;
}


/* =========================================================
   TOAST
========================================================= */

.toast {
    position:
        fixed;

    left:
        50%;

    bottom:
        25px;

    transform:
        translateX(-50%)
        translateY(30px);

    background:
        rgba(48,93,112,.94);

    color:
        white;

    padding:
        12px 20px;

    border-radius:
        15px;

    opacity:
        0;

    pointer-events:
        none;

    z-index:
        1000;

    transition:
        .35s ease;

    box-shadow:
        var(--shadow);
}

.toast.show {
    opacity:
        1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================================
   UTILITY
========================================================= */

.hidden {
    display:
        none !important;
}

@keyframes fadeUp {

    from {
        opacity:
            0;

        transform:
            translateY(15px);
    }

    to {
        opacity:
            1;

        transform:
            translateY(0);
    }
}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 850px) {

    .postBody {

        grid-template-columns:
            1fr;
    }

    .postMediaContainer {

        min-height:
            0;
    }

    .postMedia,
    .postVideo {

        min-height:
            0;

        height:
            auto;

        max-height:
            650px;

        object-fit:
            contain;
    }

    .postSide {

        border-left:
            none;

        border-top:
            1px solid
            rgba(180,225,242,.45);

        padding:
            20px;
    }

    .commentsSection {
        padding:
            0 20px 20px;
    }

    .createModal {
        width:
            min(650px, 100%);
    }

    .createContent {

        grid-template-columns:
            1fr;
    }

    .uploadArea {

        min-height:
            180px;

        height:
            auto;
    }

    #captionInput {

        min-height:
            120px;

        flex:
            none;
    }

    .preview {

        aspect-ratio:
            16 / 9;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .navbar {
        padding:
            12px 4%;
    }

    .logo {
        font-size:
            18px;
    }

    .logoBubble {
        width:
            36px;

        height:
            36px;
    }

    .navBtn {
        padding:
            8px 10px;

        font-size:
            12px;
    }

    main {
        width:

        padding-top:

    }

    .hero {
        margin-bottom:

    }

    .heroIcon {

    }

    .choiceContainer {

    .modal {
        padding:

        border-radius:

    }

    .createModal {

    .modal h2 {

    }

    .modalTop {

    }

    .uploadArea {

    }

    .preview {

        min-height:

    }

    .preview img,

    #captionInput {

    }

    .post {
        border-radius:

    }

    }

    .postMedia,
    .postVideo {

        object-fit:

    }

    }

    }

        font-size:

    }

    .commentsSection {
        padding:
            0 18px 18px;
    }

    }

}


/* =========================================================
   SHORT LAPTOP
========================================================= */

@media (min-width: 851px) and (max-height: 700px) {

        max-height:

    *,
    *::before,

            .01ms !important;

            1 !important;

        transition-duration:
            .01ms !important;

}

</style>
</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background">

    <div class="cloud one"></div>

    <div class="cloud two"></div>

    <div class="cloud three"></div>

    <div class="sparkle">✦</div>

    <div class="sparkle">✧</div>

    <div class="sparkle">✦</div>

</div>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar">

    <div
        class="logo"
        onclick="scrollToTop()">

        <div class="logoBubble">
            ☁️
        </div>

        <span>
            Cloudy
        </span>

    </div>


    <div class="navButtons">

        <button
            class="navBtn"
            onclick="openLookMode()">

            👀 Look

        </button>


        <button
            class="navBtn"
            onclick="openUploadLogin()">

            ➕ Post

        </button>

    </div>

</nav>


<!-- =====================================================
     MAIN
===================================================== -->

<main>

    <section class="hero">

        <div class="heroIcon">
            💙
        </div>

        <h1>
            Welcome to Cloudy
        </h1>

        <p>
            A tiny place for your photos, videos & memories.
        </p>

    </section>


    <section
        id="feed"
        class="feed">
    </section>

</main>


<!-- =====================================================
     WELCOME MODAL
===================================================== -->

<div
    id="welcomeOverlay"
    class="overlay">

    <div class="modal">

        <div class="modalTop">

            <div class="modalIcon">
                ☁️
            </div>

            <h2>
                What brings you here?
            </h2>

            <p>
                Choose what you'd like to do.
            </p>

        </div>


        <div class="choiceContainer">

            <button
                class="choice"
                onclick="openUploadLogin()">

                <div class="choiceIcon">
                    📤
                </div>

                <strong>
                    I'm here to Upload
                </strong>

                <span>
                    Share a photo or video
                </span>

            </button>


            <button
                class="choice"
                onclick="closeWelcome()">

                <div class="choiceIcon">
                    👀
                </div>

                <strong>
                    I'm here to Look
                </strong>

                <span>
                    Browse the little feed
                </span>

            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     PASSWORD MODAL
===================================================== -->

<div
    id="passwordOverlay"
    class="overlay hidden">

    <div class="modal">

        <div class="modalTop">

            <div class="modalIcon">
                🔐
            </div>

            <h2>
                Uploader Access
            </h2>

            <p>
                Enter the secret password to post.
            </p>

        </div>


        <div class="passwordBox">

            <input
                id="passwordInput"
                class="input"
                type="password"
                placeholder="Enter password..."
                autocomplete="off"
            >


            <button
                class="primaryBtn"
                onclick="checkPassword()">

                Unlock ✨

            </button>


            <button
                class="secondaryBtn"
                onclick="closePassword()">

                Maybe later

            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     CREATE POST MODAL
===================================================== -->

<div
    id="createOverlay"
    class="overlay hidden">

    <div class="modal createModal">

        <div class="modalTop">

            <div class="modalIcon">
                ✨
            </div>

            <h2>
                Create something
            </h2>

            <p>
                Add a photo or video and write a caption.
            </p>

        </div>


        <div class="typeSelector">

            <button
                id="photoType"
                class="typeBtn active"
                onclick="setMediaType('photo')">

                📸 Photo

            </button>


            <button
                id="videoType"
                class="typeBtn"
                onclick="setMediaType('video')">

                🎥 Video

            </button>

        </div>


        <div class="createContent">


            <!-- MEDIA -->

            <div>

                <label
                    id="uploadArea"
                    class="uploadArea"
                    for="mediaInput">

                    <div class="uploadIcon">
                        📷
                    </div>

                    <strong>
                        Choose your media
                    </strong>

                    <p>
                        You can also use your camera on mobile.
                    </p>


                    <input
                        id="mediaInput"
                        type="file"
                        accept="image/*"
                        capture="environment"
                        hidden
                    >

                </label>


                <div
                    id="preview"
                    class="preview">

                    <img
                        id="imagePreview"
                        alt="Image preview"
                    >


                    <video
                        id="videoPreview"
                        controls>
                    </video>

                </div>

            </div>


            <!-- CAPTION -->

            <div class="createRight">

                <label
                    for="captionInput">

                    Caption

                </label>


                <textarea
                    id="captionInput"
                    class="input"
                    placeholder="Write a little caption... 💭">
                </textarea>

            </div>

        </div>


        <div class="createActions">

            <button
                class="secondaryBtn"
                onclick="closeCreate()">

                Cancel

            </button>


            <button
                class="primaryBtn"
                onclick="createPost()">

                Post it! 💙

            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     TOAST
===================================================== -->

<div
    id="toast"
    class="toast">
</div>


<script>

/* =========================================================
   VARIABLES
========================================================= */

const PASSWORD = "UwU";
const COMMENT_DELETE_PASSWORD = "owo";

const COMMENT_NAMES = [
    "♡",
    "★",
    "✿",
    "಄",
    "❤︎",
    "𝄞",
    "✰"
];

let mediaType =
    "photo";

let selectedFile =
    null;

let posts =
    JSON.parse(
        localStorage.getItem(
            "cloudyPosts"
        ) || "[]"
    );


/* =========================================================
   INITIALIZE
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        renderPosts();

        document
            .getElementById(
                "mediaInput"
            )
            .addEventListener(
                "change",
                handleFile
            );

    }
);


/* =========================================================
   WELCOME
========================================================= */

function closeWelcome() {

    document
        .getElementById(
            "welcomeOverlay"
        )
        .classList
        .add("hidden");

}


function openLookMode() {

    document
        .getElementById(
            "welcomeOverlay"
        )
        .classList
        .add("hidden");


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


function scrollToTop() {

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   PASSWORD
========================================================= */

function openUploadLogin() {

    document
        .getElementById(
            "welcomeOverlay"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "passwordOverlay"
        )
        .classList
        .remove("hidden");


    setTimeout(
        () => {

            document
                .getElementById(
                    "passwordInput"
                )
                .focus();

        },
        200
    );

}


function closePassword() {

    document
        .getElementById(
            "passwordOverlay"
        )
        .classList
        .add("hidden");

}


function checkPassword() {

    const input =
        document
            .getElementById(
                "passwordInput"
            )
            .value;


    if (
        input === PASSWORD
    ) {

        document
            .getElementById(
                "passwordOverlay"
            )
            .classList
            .add("hidden");


        document
            .getElementById(
                "passwordInput"
            )
            .value =
            "";


        openCreate();

    } else {

        showToast(
            "Oops! Wrong password 💭"
        );


        const box =
            document
                .getElementById(
                    "passwordInput"
                );


        box.value =
            "";


        box.animate(
            [
                {
                    transform:
                        "translateX(-5px)"
                },

                {
                    transform:
                        "translateX(5px)"
                },

                {
                    transform:
                        "translateX(-4px)"
                },

                {
                    transform:
                        "translateX(0)"
                }
            ],
            {
                duration:
                    300
            }
        );

    }

}


/* =========================================================
   CREATE
========================================================= */

function openCreate() {

    document
        .getElementById(
            "createOverlay"
        )
        .classList
        .remove("hidden");

}


function closeCreate() {

    document
        .getElementById(
            "createOverlay"
        )
        .classList
        .add("hidden");


    resetCreateForm();

}


/* =========================================================
   MEDIA TYPE
========================================================= */

function setMediaType(type) {

    mediaType =
        type;


    const photoButton =
        document
            .getElementById(
                "photoType"
            );


    const videoButton =
        document
            .getElementById(
                "videoType"
            );


    const input =
        document
            .getElementById(
                "mediaInput"
            );


    if (
        type === "photo"
    ) {

        photoButton
            .classList
            .add("active");


        videoButton
            .classList
            .remove("active");


        input.accept =
            "image/*";


        input.capture =
            "environment";

    } else {

        videoButton
            .classList
            .add("active");


        photoButton
            .classList
            .remove("active");


        input.accept =
            "video/*";


        input.removeAttribute(
            "capture"
        );

    }


    resetPreview();

}


/* =========================================================
   FILE
========================================================= */

function handleFile(event) {

    const file =
        event.target.files[0];


    if (!file)
        return;


    selectedFile =
        file;


    showPreview(
        file
    );

}


function showPreview(file) {

    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            const preview =
                document
                    .getElementById(
                        "preview"
                    );


            const image =
                document
                    .getElementById(
                        "imagePreview"
                    );


            const video =
                document
                    .getElementById(
                        "videoPreview"
                    );


            preview.style.display =
                "block";


            if (
                file.type
                    .startsWith(
                        "image/"
                    )
            ) {

                image.src =
                    e.target.result;


                image.style.display =
                    "block";


                video.style.display =
                    "none";

            } else {

                video.src =
                    e.target.result;


                video.style.display =
                    "block";


                image.style.display =
                    "none";

            }

        };


    reader.readAsDataURL(
        file
    );

}


/* =========================================================
   RANDOM COMMENT NAME
========================================================= */

function getRandomCommentName() {

    const index =
        Math.floor(
            Math.random() *
            COMMENT_NAMES.length
        );


    return COMMENT_NAMES[index];

}


/* =========================================================
   CREATE POST
========================================================= */

function createPost() {

    if (!selectedFile) {

        showToast(
            "Please choose a photo or video first 📸"
        );

        return;
    }


    const caption =
        document
            .getElementById(
                "captionInput"
            )
            .value
            .trim();


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            const newPost = {

                id:
                    Date.now(),

                type:
                    selectedFile.type
                        .startsWith(
                            "video/"
                        )
                        ? "video"
                        : "photo",

                media:
                    e.target.result,

                caption:
                    caption,

                date:
                    new Date()
                        .toLocaleString(
                            [],
                            {
                                month:
                                    "short",

                                day:
                                    "numeric",

                                hour:
                                    "numeric",

                                minute:
                                    "2-digit"
                            }
                        ),

                /*
                 * NEW POSTS START WITH
                 * RANDOM LIKES FROM 50–70.
                 */

                likes:
                    Math.floor(
                        Math.random() *
                        21
                    ) + 50,

                liked:
                    false,

                comments:
                    []

            };


            posts.unshift(
                newPost
            );


            try {

                localStorage.setItem(
                    "cloudyPosts",
                    JSON.stringify(
                        posts
                    )
                );

            } catch(error) {

                posts.shift();


                showToast(
                    "That file is too large for browser storage 😭"
                );


                return;

            }


            renderPosts();


            closeCreate();


            showToast(
                "Posted successfully! ☁️💙"
            );


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        };


    reader.readAsDataURL(
        selectedFile
    );

}


/* =========================================================
   RENDER POSTS
========================================================= */

function renderPosts() {

    const feed =
        document
            .getElementById(
                "feed"
            );


    feed.innerHTML =
        "";


    if (
        posts.length === 0
    ) {

        feed.innerHTML = `

            <div class="empty">

                <div class="emptyIcon">
                    ☁️
                </div>

                <h2>
                    It's a little empty here...
                </h2>

                <p>
                    Be the first person to share something!
                </p>

            </div>

        `;

        return;

    }


    posts.forEach(
        post => {

            /*
             * Compatibility for older
             * posts created before comments
             * were added.
             */

            if (
                !Array.isArray(
                    post.comments
                )
            ) {

                post.comments =
                    [];

            }


            const article =
                document.createElement(
                    "article"
                );


            article.className =
                "post";


            let mediaHTML =
                "";


            if (
                post.type ===
                "video"
            ) {

                mediaHTML = `

                    <video
                        class="postVideo"
                        controls
                        preload="metadata">

                        <source
                            src="${post.media}">

                    </video>

                `;

            } else {

                mediaHTML = `

                    <img
                        class="postMedia"
                        src="${post.media}"
                        alt="Post image">

                `;

            }


            article.innerHTML = `

                <div class="postHeader">

                    <div class="profile">

                        <div class="avatar">
                            ☁️
                        </div>

                        <div>

                            <div class="username">
                                ♡ Precious ♡
                            </div>

                            <div class="date">
                                ${escapeHTML(
                                    post.date
                                )}
                            </div>

                        </div>

                    </div>


                    <button
                        class="moreBtn"
                        onclick="
                            deletePost(
                                ${post.id}
                            )
                        ">

                        ⋯

                    </button>

                </div>


                <div class="postBody">

                    <div class="postMediaContainer">

                        ${mediaHTML}

                    </div>


                    <div class="postSide">

                        <div>

                            ${
                                post.caption

                                ? `

                                    <div class="caption">${escapeHTML(post.caption.replace(/^\s+/, ""))}</div>

                                  `

                                : `

                                    <div
                                        class="
                                            caption
                                            captionEmpty
                                        ">

                                        No caption ♡

                                    </div>

                                  `
                            }

                        </div>


                        <div class="postActions">

                            <button
                                class="
                                    actionBtn
                                    ${
                                        post.liked
                                            ? "liked"
                                            : ""
                                    }
                                "
                                onclick="
                                    toggleLike(
                                        ${post.id}
                                    )
                                ">

                                ${
                                    post.liked
                                        ? "💙"
                                        : "♡"
                                }

                                ${post.likes}

                            </button>


                            <button
                                class="actionBtn"
                                onclick="
                                    toggleComments(
                                        ${post.id}
                                    )
                                ">

                                💬

                                ${
                                    post.comments.length
                                }

                            </button>


                            <button
                                class="actionBtn"
                                onclick="
                                    sharePost()
                                ">

                                ↗ Share

                            </button>

                        </div>

                    </div>

                </div>


                <!-- COMMENTS -->

                <div
                    id="comments-${post.id}"
                    class="commentsSection">

                    <div class="commentsTitle">
                        Comments 💭
                    </div>


                    <div
                        id="commentList-${post.id}"
                        class="commentList">

                        ${renderComments(
                            post.id,
                            post.comments
                        )}

                    </div>


                    <div class="commentInputRow">

                        <input
                            id="commentInput-${post.id}"
                            class="commentInput"
                            type="text"
                            maxlength="300"
                            placeholder="Write a comment..."
                            onkeydown="
                                handleCommentKey(
                                    event,
                                    ${post.id}
                                )
                            "
                        >


                        <button
                            class="commentSend"
                            onclick="
                                addComment(
                                    ${post.id}
                                )
                            ">

                            Send

                        </button>

                    </div>

                </div>

            `;


            feed.appendChild(
                article
            );

        }
    );

}


/* =========================================================
   RENDER COMMENTS
========================================================= */

function renderComments(
    postId,
    comments
) {

    if (
        !comments ||
        comments.length === 0
    ) {

        return `

            <div class="noComments">
                No comments yet... be the first! ♡
            </div>

        `;

    }


    return comments
        .map(
            (comment, index) => `

                <div class="comment">

                    <div class="commentName">

                        ${escapeHTML(
                            comment.name
                        )}

                    </div>


                    <div class="commentContent">

                        <div class="commentText">

                            ${escapeHTML(
                                comment.text
                            )}

                        </div>


                        <div class="commentTime">

                            ${escapeHTML(
                                comment.time
                            )}

                        </div>

                    </div>

                    <button
                        class="commentDelete"
                        type="button"
                        title="Delete comment"
                        aria-label="Delete comment"
                        onclick="deleteComment(${postId}, ${index})">
                        Delete
                    </button>

                </div>

            `
        )
        .join("");

}


/* =========================================================
   DELETE COMMENT
========================================================= */

function deleteComment(
    postId,
    commentIndex
) {

    const password =
        window.prompt(
            "Enter the password to delete this comment:"
        );


    if (password === null)
        return;


    if (password !== COMMENT_DELETE_PASSWORD) {

        showToast(
            "Wrong password 💭"
        );

        return;

    }


    const post =
        posts.find(
            item =>
                item.id === postId
        );


    if (
        !post ||
        !Array.isArray(post.comments) ||
        !post.comments[commentIndex]
    )
        return;


    post.comments.splice(
        commentIndex,
        1
    );


    localStorage.setItem(
        "cloudyPosts",
        JSON.stringify(posts)
    );


    renderPosts();


    const section =
        document.getElementById(
            `comments-${postId}`
        );


    if (section)
        section.classList.add("open");


    showToast(
        "Comment deleted 💙"
    );

}


/* =========================================================
   TOGGLE COMMENTS
========================================================= */

function toggleComments(id) {

    const section =
        document
            .getElementById(
                `comments-${id}`
            );


    if (!section)
        return;


    section
        .classList
        .toggle("open");


    if (
        section.classList.contains(
            "open"
        )
    ) {

        setTimeout(
            () => {

                const input =
                    document
                        .getElementById(
                            `commentInput-${id}`
                        );


                if (input) {

                    input.focus();

                }

            },
            150
        );

    }

}


/* =========================================================
   ADD COMMENT
========================================================= */

function addComment(id) {

    const input =
        document
            .getElementById(
                `commentInput-${id}`
            );


    if (!input)
        return;


    const text =
        input.value.trim();


    if (!text) {

        showToast(
            "Write something first 💭"
        );

        input.focus();

        return;

    }


    const post =
        posts.find(
            p =>
                p.id === id
        );


    if (!post)
        return;


    if (
        !Array.isArray(
            post.comments
        )
    ) {

        post.comments =
            [];

    }


    /*
     * The symbol IS the
     * commenter's name.
     */

    const comment = {

        name:
            getRandomCommentName(),

        text:
            text,

        time:
            "just now"

    };


    post.comments.push(
        comment
    );


    localStorage.setItem(
        "cloudyPosts",
        JSON.stringify(
            posts
        )
    );


    renderPosts();


    /*
     * Re-open the comments
     * after rendering.
     */

    const section =
        document
            .getElementById(
                `comments-${id}`
            );


    if (section) {

        section
            .classList
            .add("open");

    }


    showToast(
        "Comment added 💙"
    );

}


/* =========================================================
   COMMENT ENTER KEY
========================================================= */

function handleCommentKey(
    event,
    id
) {

    if (
        event.key ===
        "Enter"
    ) {

        event.preventDefault();


        addComment(
            id
        );

    }

}


/* =========================================================
   LIKE
========================================================= */

function toggleLike(id) {

    const post =
        posts.find(
            p => p.id === id
        );


    if (!post)
        return;


    post.liked =
        !post.liked;


    post.likes +=
        post.liked
            ? 1
            : -1;


    localStorage.setItem(
        "cloudyPosts",
        JSON.stringify(
            posts
        )
    );


    renderPosts();

}


/* =========================================================
   DELETE
========================================================= */

function deletePost(id) {

    const yes =
        confirm(
            "Delete this post?"
        );


    if (!yes)
        return;


    const password =
        window.prompt(
            "Enter the password to delete this post:"
        );


    if (password === null)
        return;


    if (password !== COMMENT_DELETE_PASSWORD) {

        showToast(
            "Wrong password 💭"
        );

        return;

    }


    posts =
        posts.filter(
            post =>
                post.id !== id
        );


    localStorage.setItem(
        "cloudyPosts",
        JSON.stringify(
            posts
        )
    );


    renderPosts();


    showToast(
        "Post removed ☁️"
    );

}


/* =========================================================
   SHARE
========================================================= */

async function sharePost() {

    if (
        navigator.share
    ) {

        try {

            await navigator.share({

                title:
                    "Cloudy",

                text:
                    "Check out this post on Cloudy! 💙"

            });

        } catch(error) {}

    } else {

        showToast(
            "Sharing isn't available here yet 💭"
        );

    }

}


/* =========================================================
   RESET PREVIEW
========================================================= */

function resetPreview() {

    const preview =
        document
            .getElementById(
                "preview"
            );


    const image =
        document
            .getElementById(
                "imagePreview"
            );


    const video =
        document
            .getElementById(
                "videoPreview"
            );


    preview.style.display =
        "none";


    image.src =
        "";


    video.src =
        "";


    image.style.display =
        "none";


    video.style.display =
        "none";


    selectedFile =
        null;


    document
        .getElementById(
            "mediaInput"
        )
        .value =
        "";

}


function resetCreateForm() {

    resetPreview();


    document
        .getElementById(
            "captionInput"
        )
        .value =
        "";


    mediaType =
        "photo";


    setMediaType(
        "photo"
    );

}


/* =========================================================
   DRAG & DROP
========================================================= */

const uploadArea =
    document.getElementById(
        "uploadArea"
    );


uploadArea.addEventListener(
    "dragover",
    event => {

        event.preventDefault();


        uploadArea
            .classList
            .add("dragover");

    }
);


uploadArea.addEventListener(
    "dragleave",
    () => {

        uploadArea
            .classList
            .remove("dragover");

    }
);


uploadArea.addEventListener(
    "drop",
    event => {

        event.preventDefault();


        uploadArea
            .classList
            .remove("dragover");


        const file =
            event
                .dataTransfer
                .files[0];


        if (!file)
            return;


        const valid =
            mediaType === "photo"
                ? file.type
                    .startsWith(
                        "image/"
                    )
                : file.type
                    .startsWith(
                        "video/"
                    );


        if (!valid) {

            showToast(
                mediaType === "photo"
                    ? "Please drop an image 📸"
                    : "Please drop a video 🎥"
            );

            return;

        }


        selectedFile =
            file;


        showPreview(
            file
        );

    }
);


/* =========================================================
   PASSWORD ENTER
========================================================= */

document
    .getElementById(
        "passwordInput"
    )
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                checkPassword();

            }

        }
    );


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key !==
            "Escape"
        )
            return;


        document
            .getElementById(
                "welcomeOverlay"
            )
            .classList
            .add("hidden");


        document
            .getElementById(
                "passwordOverlay"
            )
            .classList
            .add("hidden");


        document
            .getElementById(
                "createOverlay"
            )
            .classList
            .add("hidden");

    }
);


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function showToast(message) {

    const toast =
        document
            .getElementById(
                "toast"
            );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}
